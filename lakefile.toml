name = "LEANSandbox"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LEANSandbox"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "LEANSandbox"

[[lean_lib]]
name = "ExampleSubProject"
globs = ["ExampleSubProject.+"]
[[lean_lib]]
name = "CommHyp"
globs = ["CommHyp.+"]
